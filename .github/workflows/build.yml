name: Create and publish a Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        type: string

# Dual-publish during migration: GHCR (legacy) + ECR (canonical target).
# ECR push uses GitHub OIDC → github-oidc-concourse-helm3-resource-ecr-push (no static AWS keys).
env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::362072154386:role/github-oidc-concourse-helm3-resource-ecr-push
  ECR_REGISTRY: 362072154386.dkr.ecr.eu-west-1.amazonaws.com
  IMAGE_NAME: concourse-helm3-resource

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/apptweak/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ghcr.io/apptweak/${{ env.IMAGE_NAME }}:stable
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:stable
